<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دريم واي كافيه — نقاط الولاء</title>
<style>
:root{--bg:#f3f8fd;--card:#fff;--ink:#23272e;--mut:#667587;--acc:#0b72e7;--ok:#2e7d32;--bad:#c62828;--line:#dbe5f0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161c;--card:#1b222b;--ink:#eef2f6;--mut:#9aa7b5;--acc:#2f8cf0;--ok:#7fd18a;--bad:#ef8a8a;--line:#2b3541;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11161c;--card:#1b222b;--ink:#eef2f6;--mut:#9aa7b5;--acc:#2f8cf0;--ok:#7fd18a;--bad:#ef8a8a;--line:#2b3541;color-scheme:dark}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;padding:14px;max-width:640px;margin:0 auto}
.hd{display:flex;align-items:center;gap:12px;margin:4px 0 14px}.logo{width:68px;height:68px;border-radius:50%;box-shadow:0 1px 8px rgba(0,0,0,.18)}.brand{font-size:21px;font-weight:700}
h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--bg);color:var(--ink);margin-bottom:8px}
button{font:inherit;font-size:15px;padding:11px 13px;border-radius:10px;border:0;background:var(--acc);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--acc);border:1px solid var(--acc)}
button.bad{background:var(--bad)}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px}.row>*{flex:1}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}
.mut{color:var(--mut);font-size:13px}
.big{font-size:30px;font-weight:700;color:var(--acc)}
.ok{color:var(--ok);font-weight:700}.neg{color:var(--bad)}
.li{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}.li.c{cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px}.stat b{display:block;font-size:19px}
.void{text-decoration:line-through;opacity:.5}
label{display:block;font-size:13px;color:var(--mut);margin:2px 0 3px}
textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;line-height:1.6;background:var(--bg);color:var(--ink);margin-bottom:8px}a.btn{display:block;text-align:center;text-decoration:none;font-size:15px;padding:11px 13px;border-radius:10px;background:#25a244;color:#fff}
.ov{position:fixed;inset:0;background:var(--bg);z-index:99;display:flex;align-items:center;justify-content:center;padding:20px}.ov .card{width:100%;max-width:360px;margin:0;text-align:center}
[hidden]{display:none!important}
</style>
</head>

<h2>تسجيل الدخول</h2>
<input id="em" type="email" placeholder="البريد الإلكتروني" autocomplete="username">
<input id="lpw" type="password" placeholder="كلمة المرور" autocomplete="current-password">

</div></div>
<script>
window.__app=function(){
  var $=function(i){return document.getElementById(i)};
  var db=null,admin=false,loaded=false,cur=null,edit=null,unlocked=false,pwDoc=undefined,fails=0,lockUntil=0,idle=null,lastOp={},wmKey="";
  var customers={},txs=[];
  var D={egpPerPoint:10,redeemPoints:100,redeemValue:20,minRedeem:100},S=Object.assign({},D);
  function norm(p){return String(p).replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)}).replace(/\D/g,"")}
  function n(x){return Number(x||0).toLocaleString("en-US",{maximumFractionDigits:2})}
  function say(t){$("msg").textContent=t||""}
  function fail(){say("تعذر الحفظ — تأكد من الصلاحية أو الاتصال")}
  function ptsFor(a){return Math.floor(a/S.egpPerPoint)}
  function discFor(p){return Math.round(p*S.redeemValue/S.redeemPoints*100)/100}
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function arm(b,fn){var t=b.textContent;b.onclick=function(){if(b.dataset.a){fn();return}b.dataset.a=1;b.textContent="تأكيد؟";setTimeout(function(){delete b.dataset.a;b.textContent=t},4000)}}

  function commit(c,tx){
    c.updatedAt=Date.now();customers[c.phone]=c;
    if(tx){tx.phone=c.phone;tx.name=c.name||"";tx.ts=Date.now();lastOp[c.phone]=tx}
    if(!db){if(tx){tx.id="l"+tx.ts;txs.unshift(tx)}render();return}
    render();
    db.doc("customers/"+c.phone).set(c).catch(fail);
    if(tx)db.collection("tx").add(tx).catch(fail);
  }
  function newC(p,name){return {phone:p,name:name||"",points:0,spent:0,earned:0,redeemedPts:0,discount:0,visits:0,createdAt:Date.now()}}

  $("open").onclick=function(){
    var p=norm($("phone").value);
    if(p.length<10){say("اكتب رقم موبايل صحيح");return}
    if(!customers[p]){
      if(!loaded){say("جاري تحميل البيانات، انتظر لحظة ثم حاول مرة أخرى");return}
      if(db){
        say("جاري التحقق...");
        db.doc("customers/"+p).get().then(function(s){
          if(s.exists){customers[p]=Object.assign({},s.data());say("")}
          else{commit(newC(p,$("name").value.trim()));say("تم تسجيل عميل جديد")}
          cur=p;$("name").value="";render();
        }).catch(function(){say("تعذر التحقق من العميل، حاول مرة أخرى")});
        return;
      }
      commit(newC(p,$("name").value.trim()));say("تم تسجيل عميل جديد");
    }else say("");
    cur=p;$("name").value="";render();
  };
  $("amt").oninput=$("rp").oninput=function(){prev()};
  function prev(){
    var a=parseFloat($("amt").value)||0;
    $("prevE").textContent=a>0?"هيكسب "+n(ptsFor(a))+" نقطة":"";
    var r=parseInt($("rp").value,10)||0;
    $("prevR").textContent=r>0?"قيمة الخصم: "+n(discFor(r))+" جنيه":"أقل استبدال "+n(S.minRedeem)+" نقطة";
  }
  $("earn").onclick=function(){
    var c=customers[cur],a=parseFloat($("amt").value);
    if(!c)return;
    if(!(a>0)){say("اكتب قيمة الفاتورة");return}
    var p=ptsFor(a);
    c.points+=p;c.spent+=a;c.earned+=p;c.visits++;
    commit(c,{type:"earn",amount:a,points:p});$("amt").value="";say("تمت إضافة "+n(p)+" نقطة");prev();
  };
  $("redeem").onclick=function(){
    var c=customers[cur],r=parseInt($("rp").value,10);
    if(!c)return;
    if(!(r>0)||r<S.minRedeem){say("أقل استبدال "+n(S.minRedeem)+" نقطة");return}
    if(r>c.points){say("رصيد النقاط غير كافي");return}
    var d=discFor(r);
    c.points-=r;c.redeemedPts+=r;c.discount+=d;
    commit(c,{type:"redeem",points:-r,discount:d});$("rp").value="";say("خصم "+n(d)+" جنيه على الفاتورة");prev();
  };

  function render(){
    var c=cur&&customers[cur];
    $("cust").hidden=!c;
    if(c){
      $("cname").textContent=c.name||"عميل";$("cphone").textContent=c.phone;
      $("bal").textContent=n(c.points)+" نقطة";
      $("worth").textContent="تساوي خصم "+n(discFor(c.points))+" جنيه";
      var lt=lastTx(c.phone),k=c.phone+"|"+c.points+"|"+(lt?lt.ts:0);
      if(k!==wmKey){wmKey=k;$("wm").value=waText(c)}
      prev();
    }
    var arr=Object.keys(customers).map(function(k){return customers[k]}).sort(function(a,b){return(b.updatedAt||0)-(a.updatedAt||0)});
    var r=$("recent");r.textContent="";
    if(!arr.length)r.appendChild(el("div","mut",loaded?"لسه مفيش عملاء":"جاري التحميل..."));
    arr.slice(0,8).forEach(function(x){
      var row=el("div","li c");row.appendChild(el("span",0,(x.name||"عميل")+" — "+x.phone));row.appendChild(el("span","mut",n(x.points)+" نقطة"));
      row.onclick=function(){cur=x.phone;render();window.scrollTo(0,0)};r.appendChild(row);
    });
    if(admin&&unlocked)renderAdm(arr);
  }

  function renderAdm(arr){
    var T={s:0,e:0,r:0,d:0};
    arr.forEach(function(x){T.s+=x.spent||0;T.e+=x.earned||0;T.r+=x.redeemedPts||0;T.d+=x.discount||0});
    var st=$("stats");st.textContent="";
    [["العملاء",arr.length],["إجمالي المبيعات (جنيه)",T.s],["نقاط صادرة",T.e],["نقاط مستبدلة",T.r],["خصومات ممنوحة (جنيه)",T.d],["نقاط متاحة",arr.reduce(function(a,x){return a+(x.points||0)},0)]].forEach(function(p){
      var b=el("div","stat");b.appendChild(el("b",0,n(p[1])));b.appendChild(el("span","mut",p[0]));st.appendChild(b);
    });
    var q=($("q").value||"").trim().toLowerCase(),cl=$("clist");cl.textContent="";
    arr.filter(function(x){return !q||(x.name||"").toLowerCase().indexOf(q)>-1||x.phone.indexOf(norm(q)||"~")>-1}).slice(0,50).forEach(function(x){
      var row=el("div","li c");row.appendChild(el("span",0,(x.name||"عميل")+" — "+x.phone));
      row.appendChild(el("span","mut",n(x.points)+" نقطة | "+n(x.spent)+" ج"));
      row.onclick=function(){edit=x.phone;showEd()};cl.appendChild(row);
    });
    var tl=$("txl");tl.textContent="";
    txs.slice(0,60).forEach(function(t){
      var row=el("div","li"+(t.void?" void":""));
      var L={earn:"فاتورة",redeem:"استبدال",adjust:"تعديل"}[t.type]||t.type;
      var info=el("span");
      info.appendChild(el("div",0,L+" — "+(t.name||t.phone)));
      info.appendChild(el("div","mut",new Date(t.ts).toLocaleString("ar-EG",{dateStyle:"short",timeStyle:"short"})+(t.note?" — "+t.note:"")));
      var side=el("span");side.style.textAlign="left";
      var d=t.type==="earn"?n(t.amount)+" ج ← ":t.type==="redeem"?"خصم "+n(t.discount)+" ج ← ":"";
      side.appendChild(el("div",t.points<0?"neg":"ok",d+(t.points>0?"+":"")+n(t.points)));
      if(!t.void&&t.id){var vb=el("button","sec","إلغاء");vb.style.padding="4px 8px";vb.style.fontSize="12px";arm(vb,function(){voidTx(t)});side.appendChild(vb)}
      row.appendChild(info);row.appendChild(side);tl.appendChild(row);
    });
    if(!txs.length)tl.appendChild(el("div","mut","لا توجد عمليات"));
  }

  function voidTx(t){
    var c=customers[t.phone];
    if(c){
      if(t.type==="earn"){c.points-=t.points;c.spent-=t.amount;c.earned-=t.points;c.visits=Math.max(0,c.visits-1)}
      else if(t.type==="redeem"){c.points-=t.points;c.redeemedPts+=t.points;c.discount-=t.discount}
      else c.points-=t.points;
      c.updatedAt=Date.now();customers[c.phone]=c;
      if(db)db.doc("customers/"+c.phone).set(c).catch(fail);
    }
    t.void=true;if(lastOp[t.phone]&&lastOp[t.phone].ts===t.ts)delete lastOp[t.phone];
    if(db){var o=Object.assign({},t);delete o.id;db.doc("tx/"+t.id).set(o).catch(fail)}
    render();
  }

  function showEd(){
    var c=customers[edit];$("ed").hidden=!c;if(!c)return;
    $("edt").textContent=(c.name||"عميل")+" — "+c.phone;$("en").value=c.name||"";$("ea").value="";$("eno").value="";
    $("ed").scrollIntoView();
  }
  $("ens").onclick=function(){var c=customers[edit];if(!c)return;c.name=$("en").value.trim();commit(c);showEd()};
  $("eas").onclick=function(){
    var c=customers[edit],a=parseInt($("ea").value,10);
    if(!c||!a)return;
    c.points+=a;commit(c,{type:"adjust",points:a,note:$("eno").value.trim()});showEd();
  };
  arm($("edel"),function(){
    delete customers[edit];if(cur===edit)cur=null;
    if(db)db.doc("customers/"+edit).delete().catch(fail);
    edit=null;$("ed").hidden=true;render();
  });
  $("eclose").onclick=function(){edit=null;$("ed").hidden=true};
  $("q").oninput=function(){render()};
  $("ss").onclick=function(){
    var v={egpPerPoint:parseFloat($("s1").value),redeemPoints:parseFloat($("s2").value),redeemValue:parseFloat($("s3").value),minRedeem:parseFloat($("s4").value)};
    if(!(v.egpPerPoint>0&&v.redeemPoints>0&&v.redeemValue>=0&&v.minRedeem>0)){$("smsg").textContent="تأكد من القيم";return}
    S=v;render();
    if(db)db.doc("settings/main").set(v).then(function(){$("smsg").textContent="تم الحفظ"}).catch(function(){$("smsg").textContent="تعذر الحفظ"});
    else $("smsg").textContent="تم الحفظ مؤقتا";
  };
  function lastTx(p){
    var a=lastOp[p],b=null;
    for(var i=0;i<txs.length;i++){if(txs[i].phone===p&&!txs[i].void){b=txs[i];break}}
    if(a&&a.void)a=null;
    return (a&&(!b||(a.ts||0)>=(b.ts||0)))?a:b;
  }
  function waText(c){
    var t=lastTx(c.phone),L=[];
    L.push("أهلا "+(c.name||"عزيزي العميل")+" 👋","دريم واي كافيه ☕","");
    if(t){
      var after=c.points,before=after-t.points;
      if(t.type==="earn")L.push("آخر عملية: فاتورة بقيمة "+n(t.amount)+" جنيه","رصيدك السابق: "+n(before)+" نقطة","تمت إضافة: "+n(t.points)+" نقطة");
      else if(t.type==="redeem")L.push("آخر عملية: استبدال نقاط بخصم "+n(t.discount)+" جنيه","رصيدك السابق: "+n(before)+" نقطة","تم خصم: "+n(-t.points)+" نقطة");
      else L.push("آخر عملية: تعديل رصيد","رصيدك السابق: "+n(before)+" نقطة","التعديل: "+(t.points>0?"+":"-")+n(Math.abs(t.points))+" نقطة");
      L.push((t.type==="redeem"?"المتبقي في رصيدك: ":"رصيدك الحالي: ")+n(after)+" نقطة (تساوي خصم "+n(discFor(after))+" جنيه)");
    }else L.push("رصيدك الحالي: "+n(c.points)+" نقطة (تساوي خصم "+n(discFor(c.points))+" جنيه)");
    L.push("","إجمالي ما اكتسبته حتى الآن: "+n(c.earned)+" نقطة","","شكرا لزيارتك 🌟");
    return L.join("\n");
  }
  function waTextOld(c){
    var t=lastTx(c.phone),op="لا توجد عمليات بعد";
    if(t){
      if(t.type==="earn")op="فاتورة بقيمة "+n(t.amount)+" جنيه (+"+n(t.points)+" نقطة)";
      else if(t.type==="redeem")op="استبدال "+n(-t.points)+" نقطة (خصم "+n(t.discount)+" جنيه)";
      else op="تعديل رصيد ("+(t.points>0?"+":"")+n(t.points)+" نقطة)";
    }
    return "أهلا "+(c.name||"عزيزي العميل")+" 👋\nدريم واي كافيه ☕\n\nإجمالي النقاط المكتسبة حتى الآن: "+n(c.earned)+" نقطة\nآخر عملية: "+op+"\nرصيدك الجديد: "+n(c.points)+" نقطة (تساوي خصم "+n(discFor(c.points))+" جنيه)\n\nشكرا لزيارتك 🌟";
  }
  function waNum(p){p=norm(p);if(p.indexOf("00")===0)return p.slice(2);if(p.length===11&&p.charAt(0)==="0")return "20"+p.slice(1);return p}
  $("wa").onclick=function(){var c=customers[cur];if(!c)return;$("wa").href="https://wa.me/"+waNum(c.phone)+"?text="+encodeURIComponent($("wm").value)};
  $("cpy").onclick=function(){
    var b=$("cpy"),t=$("wm").value;
    function ok(){b.textContent="تم النسخ ✓";setTimeout(function(){b.textContent="نسخ الرسالة"},2000)}
    function no(){$("wm").select();b.textContent="حدد الرسالة وانسخها";setTimeout(function(){b.textContent="نسخ الرسالة"},3000)}
    try{navigator.clipboard.writeText(t).then(ok,no)}catch(e){no()}
  };
  function fillS(){$("s1").value=S.egpPerPoint;$("s2").value=S.redeemPoints;$("s3").value=S.redeemValue;$("s4").value=S.minRedeem}
  function tab(a){$("cash").hidden=a;$("adm").hidden=!a;$("tc").className=a?"sec":"";$("ta").className=a?"":"sec"}
  function b64(buf){var s="",a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
  function unb64(t){var s=atob(t),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
  function derive(pw,salt,it){
    return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]).then(function(k){
      return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:salt,iterations:it},k,256)}).then(b64);
  }
  function lm(t){$("lmsg").textContent=t||""}
  function bump(){clearTimeout(idle);if(unlocked)idle=setTimeout(function(){lockAdmin();tab(false)},300000)}
  function lockAdmin(){
    unlocked=false;clearTimeout(idle);$("adin").hidden=true;$("lock").hidden=false;
    ["pw","pw2","cp0","cp1"].forEach(function(i){$(i).value=""});$("cpm").textContent="";
  }
  function showAdm(){$("lock").hidden=true;$("adin").hidden=false;unlocked=true;fillS();bump();render()}
  function gate(){
    if(unlocked){showAdm();return}
    $("lock").hidden=false;$("adin").hidden=true;lm("");$("pw").value="";$("pw2").value="";
    if(!db){$("lt").textContent="الحفظ المشترك غير متاح";$("unl").disabled=true;return}
    if(!(window.crypto&&crypto.subtle)){$("lt").textContent="المتصفح لا يدعم التشفير";$("unl").disabled=true;return}
    $("unl").disabled=true;$("lt").textContent="جاري التحقق...";pwDoc=undefined;
    db.doc("settings/admin").get().then(function(s){
      pwDoc=s.exists?s.data():null;
      $("lt").textContent=pwDoc?"لوحة الإدارة محمية بكلمة مرور":"أنشئ كلمة مرور للوحة الإدارة";
      $("pw2").hidden=!!pwDoc;$("pw").placeholder=pwDoc?"كلمة المرور":"كلمة مرور جديدة (6 أحرف على الأقل)";
      $("unl").textContent=pwDoc?"دخول":"حفظ ودخول";$("unl").disabled=false;
    }).catch(function(){$("lt").textContent="تعذر التحقق، اضغط دخول للمحاولة مرة أخرى";$("unl").disabled=false});
  }
  $("unl").onclick=function(){
    var p=$("pw").value;
    if(pwDoc===undefined){gate();return}
    if(Date.now()<lockUntil){lm("حاول بعد "+Math.ceil((lockUntil-Date.now())/1000)+" ثانية");return}
    if(!pwDoc){
      if(p.length<6){lm("كلمة المرور 6 أحرف على الأقل");return}
      if(p!==$("pw2").value){lm("كلمتا المرور غير متطابقتين");return}
      var salt=crypto.getRandomValues(new Uint8Array(16));
      derive(p,salt,100000).then(function(h){
        var d={salt:b64(salt),hash:h,iter:100000,updatedAt:Date.now()};
        return db.doc("settings/admin").set(d).then(function(){pwDoc=d;showAdm()});
      }).catch(function(){lm("تعذر الحفظ")});
      return;
    }
    derive(p,unb64(pwDoc.salt),pwDoc.iter||100000).then(function(h){
      if(h===pwDoc.hash){fails=0;showAdm()}
      else{fails++;if(fails>=5){lockUntil=Date.now()+30000*Math.min(fails-4,10);lm("محاولات كثيرة، انتظر قليلا")}else lm("كلمة المرور غير صحيحة")}
    }).catch(function(){lm("حدث خطأ")});
  };
  $("cps").onclick=function(){
    var a=$("cp0").value,b=$("cp1").value;
    if(!pwDoc||!unlocked)return;
    if(b.length<6){$("cpm").textContent="كلمة المرور الجديدة 6 أحرف على الأقل";return}
    derive(a,unb64(pwDoc.salt),pwDoc.iter||100000).then(function(h){
      if(h!==pwDoc.hash){$("cpm").textContent="كلمة المرور الحالية غير صحيحة";return}
      var salt=crypto.getRandomValues(new Uint8Array(16));
      return derive(b,salt,100000).then(function(nh){
        var d={salt:b64(salt),hash:nh,iter:100000,updatedAt:Date.now()};
        return db.doc("settings/admin").set(d).then(function(){pwDoc=d;$("cp0").value="";$("cp1").value="";$("cpm").textContent="تم تغيير كلمة المرور"});
      });
    }).catch(function(){$("cpm").textContent="تعذر التغيير"});
  };
  $("tc").onclick=function(){lockAdmin();tab(false)};
  $("ta").onclick=function(){tab(true);gate()};
  $("lockb").onclick=function(){lockAdmin();tab(false)};
  document.addEventListener("click",bump);document.addEventListener("keydown",bump);

  fillS();render();
  setTimeout(function(){if(!loaded){loaded=true;render();say("البيانات المشتركة غير متاحة حاليا")}},10000);

  Promise.all([claude.use("db"),claude.use("user")]).then(function(r){
    db=r[0];var u=r[1];
    return Promise.resolve(u&&u.canEdit?u.canEdit():false).catch(function(){return false}).then(function(a){
      admin=a===true;$("ta").hidden=!admin;
      if(!db){loaded=true;render();say("الحفظ المشترك غير متاح، البيانات مؤقتة");return}
      db.collection("customers").onSnapshot(function(s){
        loaded=true;var m={};
        (s.docs||[]).forEach(function(x){var v=x.data?x.data():x;if(v&&v.phone)m[v.phone]=Object.assign({},v)});
        customers=m;render();
      },function(){loaded=true;render();say("تعذر تحميل العملاء")});
      db.collection("tx").orderBy("ts","desc").limit(200).onSnapshot(function(s){
        txs=(s.docs||[]).map(function(x){var v=x.data?x.data():x;return Object.assign({},v,{id:x.id||(x.ref&&x.ref.id)})});render();
      },function(){});
      db.doc("settings/main").onSnapshot(function(s){
        var v=s&&s.data?s.data():null;
        if(v&&v.egpPerPoint>0){S=Object.assign({},D,v);fillS();render()}
      },function(){});
    });
  }).catch(function(){loaded=true;render()});
};
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,doc,getDoc,setDoc,deleteDoc,addDoc,onSnapshot,query,orderBy,limit}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ===== ضع إعدادات مشروع Firebase هنا (من Project settings ← Your apps) ===== */
const FIREBASE_CONFIG={
  apiKey:"YOUR_API_KEY",
  authDomain:"YOUR_PROJECT_ID.firebaseapp.com",
  projectId:"YOUR_PROJECT_ID",
  appId:"YOUR_APP_ID"
};
/* ========================================================================== */

const $=id=>document.getElementById(id);
const configured=FIREBASE_CONFIG.projectId!=="YOUR_PROJECT_ID";
let isAdmin=false,started=false,auth=null,fs=null;

if(!configured){
  $("lerr").textContent="افتح index.html وضع إعدادات Firebase أولا";
}else{
  const app=initializeApp(FIREBASE_CONFIG);
  fs=getFirestore(app);auth=getAuth(app);

  const snapDoc=s=>({id:s.id,exists:s.exists(),data:()=>s.exists()?s.data():undefined});
  const mkQuery=q=>({
    orderBy:(f,d)=>mkQuery(query(q,orderBy(f,d||"asc"))),
    limit:n=>mkQuery(query(q,limit(n))),
    onSnapshot:(next,err)=>onSnapshot(q,s=>next({docs:s.docs.map(d=>({id:d.id,exists:true,data:()=>d.data()}))}),err)
  });
  const mkDoc=path=>{const r=doc(fs,path);return{
    get:()=>getDoc(r).then(snapDoc),
    set:d=>setDoc(r,d),
    delete:()=>deleteDoc(r),
    onSnapshot:(next,err)=>onSnapshot(r,s=>next(snapDoc(s)),err)
  }};
  const mkCol=path=>{const c=collection(fs,path),q=mkQuery(c);q.doc=id=>mkDoc(path+"/"+id);q.add=d=>addDoc(c,d).then(r=>({id:r.id}));return q};

  /* نفس واجهة claude.use المستخدمة في التطبيق، لكن فوق Firebase */
  window.claude={use:async name=>{
    if(name==="db")return{doc:mkDoc,collection:mkCol};
    if(name==="user")return{canEdit:async()=>isAdmin,isOwner:async()=>isAdmin};
    return null;
  }};

  onAuthStateChanged(auth,async u=>{
    if(!u){$("login").hidden=false;return}
    try{isAdmin=(await getDoc(doc(fs,"admins",u.uid))).exists()}catch(e){isAdmin=false}
    $("login").hidden=true;
    if(!started){started=true;window.__app()}
  });
  const go=()=>{
    $("lerr").textContent="";
    signInWithEmailAndPassword(auth,$("em").value.trim(),$("lpw").value).catch(()=>{$("lerr").textContent="الإيميل أو كلمة المرور غير صحيحة"});
  };
  $("lbtn").onclick=go;
  $("lpw").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
  $("out").onclick=()=>signOut(auth).then(()=>location.reload());
}
</script>
